[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "renshuu-n3-companion"
version = "0.1.0"
description = "Companion curriculum, validator, and multi-format study guide compiler for Renshuu JLPT N3 Grammar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
renshuu-n3 = "renshuu_n3.cli:main"

[tool.setuptools.packages.find]
include = ["renshuu_n3*"]

[tool.setuptools.package-data]
renshuu_n3 = ["assets/*.css"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
